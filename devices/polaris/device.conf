# Xiaomi Mi MIX 2S (polaris, SDM845): a starting profile for HackiOS.
#
# Every number here comes from the phone's own device tree, extracted from the official
# MIUI 12.5 fastboot package (V12.5.1.0.QDGCNXM) as shipped by Xiaomi:
#   model    Xiaomi Technologies, Inc. Polaris P2 v2.1
#   board-id <0x2a 0x0>    msm-id <0x141 0x20001>
# It is NOT copied from raphael (SM8150) or redwood (SM7325): those are different SoCs with
# different addresses, and reusing their constants is how a port silently fails.
#
# Nothing here has been run on a phone. See STATUS.md.
NAME="Xiaomi Mi MIX 2S (polaris)"
KIND=phone
SOC="Qualcomm Snapdragon 845 (SDM845)"
UEFI_TARGET=polaris
UEFI_FD=${UEFI_FD:-}
DTB=out/polaris/polaris.dtb

# --- where the UEFI image and the payload go ------------------------------------------------
# MEASURED, from this phone's own xbl.img in the same official package. xbl.img is an ELF64
# and one of its program headers says exactly where the boot ROM puts the firmware volume:
#
#   PT_LOAD  off=0x00082000  paddr=0x9FC00000  filesz=0x220000  memsz=0x220000
#
# That segment holds a real UEFI volume: `_FVH` at file offset 0x82028, volume GUID
# 8c8ce578-8a3d-4f1c-9935-896185c32dd3 (the standard FFS2 GUID), FvLength 0x220000 which
# matches the segment byte for byte.
#
# FD_BASE equals raphael's, which is now a confirmed coincidence rather than an assumption.
# FD_SIZE does NOT: it is 0x220000 (2.125 MiB), not raphael's 0x300000. A Mu-Silicium image
# for this board must fit in 0x220000.
FD_BASE=0x9FC00000
FD_SIZE=0x220000

# PAYLOAD_BASE: still not measured. What is known is the DDR the firmware has already spoken
# for. The device tree's reserved-memory carves everything from 0x85700000 up to 0xb0000000
# (the last region is ramdump_fb@af000000..0xb0000000, and the tree's physBase is
# 0xb0000000). Above 0x9f800000 the only free run before that ceiling is 0x9f800000..
# 0xb0000000, and the firmware volume itself sits at 0x9fc00000 inside it.
#
# 0xF0000000 is above all of it and is where the loader has always put the payload, so it
# is kept -- but note what that depends on: the loader's choose_window() asks UEFI for the
# largest free block and explicitly steers around [PAYLOAD_BASE, +PAYLOAD_MAX_SIZE), so the
# kernel's RAM window is chosen from the UEFI map at run time rather than from this number.
# PAYLOAD_BASE only has to be real DDR that the firmware is not using. On polaris that is
# true of 0xF0000000 if and only if the board has memory up there, which the tree does not
# state (its /memory node is zeroed by the bootloader). If the payload is never found at
# boot, this is the first number to question.
PAYLOAD_BASE=0xF0000000

# The framebuffer. polaris' own bootloader and the retired ABL chain both place it at
# 0x9c000000 (36 MiB region), the same base raphael uses -- one of the few coincidences.
FB_BASE=0x9C000000

# --- radios ---------------------------------------------------------------------------------
# polaris is WCN3990 over ICNSS, which Linux drives with ath10k SNOC -- the same driver
# raphael uses. The Linux compatibility layer in wifi/lx/ is what makes this reachable.
WIFI_ATH10K=1
WIFI_ATH11K=0

# --- boot arguments -------------------------------------------------------------------------
# gic_timer_irq=19: polaris' architectural timer is <1 3 ...>, whose INTID is 16 + PPI 3 = 19.
# cpus=4: only the four Cortex-A55s have ever been observed starting under XNU on polaris.
#   Cores 4-7 (the A75 cluster) have never been brought up on either chain; do not claim 8.
# Everything else off: bring up the display and the CPU first, and add one subsystem at a time.
BOOTARGS="gic_timer_irq=19 cpus=4 touchscreen=0 buttons=0 cpufreq=0 gpu=0 fb_scan=1 wifi=0 modem=0 adsp=0 ufs=0 ufs_write=0"

DEFAULT_SECS=180
USERLAND_VARS="GL=1 REST=1 QUIET=1 OSLOG= RC=$ROOT/userland/rc.launchd RC_JOBS=$ROOT/devices/polaris/polaris.jobs"
FIRMWARE=""
