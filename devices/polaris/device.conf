# Xiaomi Mi MIX 2S (polaris, SDM845): a starting profile for HackiOS.
#
# Every number here comes from the phone's own device tree, extracted from the official
# MIUI 12.5 fastboot package (V12.5.1.0.QDGCNXM) as shipped by Xiaomi:
#   model    Xiaomi Technologies, Inc. Polaris MP v2.1
#   board-id <0x2c 0x0>    msm-id <0x141 0x20001>
# It is NOT copied from raphael (SM8150) or redwood (SM7325): those are different SoCs with
# different addresses, and reusing their constants is how a port silently fails.
#
# Status: the UEFI firmware in prebuilt/ runs on the phone -- `fastboot boot` reaches its XNU
# loader and it prints its diagnostics on the screen. The kernel has not started on it yet.
# See STATUS.md.
NAME="Xiaomi Mi MIX 2S (polaris)"
KIND=phone
SOC="Qualcomm Snapdragon 845 (SDM845)"
UEFI_TARGET=polaris
UEFI_FD=${UEFI_FD:-}
DTB=out/polaris/polaris.dtb

# --- where the UEFI image and the payload go ------------------------------------------------
# MEASURED, from this phone's own xbl.img in the same official package. xbl.img is an ELF64
# and one of its program headers says exactly where the boot ROM puts the firmware volume:
#
#   PT_LOAD  off=0x00082000  paddr=0x9FC00000  filesz=0x220000  memsz=0x220000
#
# That segment holds a real UEFI volume: `_FVH` at file offset 0x82028, volume GUID
# 8c8ce578-8a3d-4f1c-9935-896185c32dd3 (the standard FFS2 GUID), FvLength 0x220000 which
# matches the segment byte for byte.
#
# FD_BASE equals raphael's, which is now a confirmed coincidence rather than an assumption.
# FD_SIZE does NOT: it is 0x220000 (2.125 MiB), not raphael's 0x300000. A Mu-Silicium image
# for this board must fit in 0x220000.
FD_BASE=0x9FC00000
FD_SIZE=0x220000

# PAYLOAD_BASE. raphael and redwood put this at 0xF0000000; on polaris that address is not
# memory. Measured from XBL's own platform config (`uefiplat.cfg`, recovered from this
# phone's xbl.img -- the [MemoryMap] block is also what Mu-Silicium's polarisPkg
# MemoryMapLib.c carries, so the two independent sources agree):
#
#   Kernel             0x80000000..0x85600000   Reserv
#   HYP                0x85600000..0x85cd0000   Conv
#   DXE Heap           0x97c00000..0x9d330000   Conv   (87.2 MiB)
#   Display Reserved   0x9d400000..0x9f800000   Reserv
#   FV Region/ABOOT FV/UEFI FD/... 0x9f800000..0xa0000000
#   <-- the gap 0xa0000000..0xb0400000 is 260 MiB of unpromised DDR
#   MLVM               0xb0400000..0xb9400000   Reserv
#
# DDR ends at 0xB9400000. 0xF0000000 is 0.86 GiB ABOVE the top of RAM and inside the MMIO
# hole below 4 GiB, so a payload copied there is written to nothing: the loader would then
# read its own magic back from nonexistent memory and report no payload.
#
# 0xA0000000 is chosen because it is DDR (between the last UEFI region and MLVM), it is
# 256 MiB-aligned, it is clear of every reservation, and the loader's choose_window() steers
# the kernel's RAM window around [PAYLOAD_BASE, +PAYLOAD_MAX_SIZE) anyway. It is still a
# choice rather than a measurement: uefiplat.cfg does not name a payload region, so what
# confirms it is a boot where the loader finds the container.
PAYLOAD_BASE=0xA0000000

# The framebuffer. MEASURED: polaris' device tree reserves
#
#   cont_splash_region@9d400000   reg = <0x9d400000 0x2400000>   (36 MiB)
#
# and 0x9d400000 + 0x2400000 = 0xa0000000, which is exactly where its 512 MiB low-RAM
# reservation begins. It is NOT raphael's 0x9c000000: that base does not appear anywhere in
# polaris' tree. This was a carry-over and is now corrected.
FB_BASE=0x9D400000

# --- radios ---------------------------------------------------------------------------------
# polaris is WCN3990 over ICNSS, which Linux drives with ath10k SNOC -- the same driver
# raphael uses. The Linux compatibility layer in wifi/lx/ is what makes this reachable.
WIFI_ATH10K=1
WIFI_ATH11K=0

# --- boot arguments -------------------------------------------------------------------------
# gic_timer_irq=19: polaris' architectural timer is <1 3 ...>, whose INTID is 16 + PPI 3 = 19.
# cpus=4: only the four Cortex-A55s have ever been observed starting under XNU on polaris.
#   Cores 4-7 (the A75 cluster) have never been brought up on either chain; do not claim 8.
# Everything else off: bring up the display and the CPU first, and add one subsystem at a time.
BOOTARGS="gic_timer_irq=19 cpus=4 touchscreen=0 buttons=0 cpufreq=0 gpu=0 fb_scan=1 wifi=0 modem=0 adsp=0 ufs=0 ufs_write=0"

DEFAULT_SECS=180
USERLAND_VARS="GL=1 REST=1 QUIET=1 OSLOG= RC=$ROOT/userland/rc.launchd RC_JOBS=$ROOT/devices/polaris/polaris.jobs"
FIRMWARE=""
