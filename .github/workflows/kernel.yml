name: kernel

# Builds the XNU kernel on GitHub's runners, so that nothing has to be compiled on a local
# machine. The kernel is XNU 8796.121.2 (the kernel of iOS 16.5) with this repository's work on
# top of it; the build is the one xnu/README.md describes, done on Ubuntu with stock clang and
# theos' Linux cctools.
#
# Two jobs: `patch` is fast and answers "does the work still apply to Apple's tag"; `kernel` is
# the real build and uploads the Mach-O. `kernel` needs `patch` to pass first.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  patch:
    name: the work applies to Apple's tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch xnu-8796.121.2 and apply hakios.patch
        run: |
          set -e
          git clone -q --depth 1 --branch xnu-8796.121.2 \
            https://github.com/apple-oss-distributions/xnu.git /tmp/xnu
          test "$(git -C /tmp/xnu rev-parse HEAD)" = \
            "c54f35ca767986246321eb901baf8f5ff7923f6a" \
            || { echo "the tag moved"; exit 1; }
          git -C /tmp/xnu apply --whitespace=nowarn --check "$PWD/xnu/hakios.patch"
          echo "patch applies; $(grep -c '^diff --git' xnu/hakios.patch) files changed"

  loader:
    name: build the loader
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends clang lld llvm
          clang --version | head -1

      - name: Build
        run: |
          set -e
          # xnuloader/build.sh wants an identity.h made from the builder's own IPSW. The
          # placeholder path exists for exactly this: building the loader without Apple's
          # files. It is not an identity that can boot iOS, only one that links.
          cd xnuloader
          ./mkidentity.sh --placeholder || true
          ls -l identity.h || { echo "no identity.h"; exit 1; }
          cd ..
          ./xnuloader/build.sh
          ls -l xnuloader/loader.efi
          sha256sum xnuloader/loader.efi

      - name: Upload the loader
        uses: actions/upload-artifact@v4
        with:
          name: loader.efi
          path: xnuloader/loader.efi
          if-no-files-found: error
          retention-days: 14

  kernel:
    name: build the kernel
    needs: patch
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Disk space
        run: |
          df -h /
          # AGENT_TOOLSDIRECTORY is not set on every runner; an unset name under `set -e`
          # would abort the step, so it is expanded defensively.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /usr/local/share/boost ${AGENT_TOOLSDIRECTORY:+"$AGENT_TOOLSDIRECTORY"} || true
          df -h /

      - name: Toolchain
        run: |
          sudo apt-get update -qq
          # uuid-dev is what xnu-deps/hostinc/hostcompat.h includes as <uuid/uuid.h>; without
          # it the SETUP/ host tools (decomment, setsegname, ...) fail to compile and
          # `exporthdrs` dies before the kernel build starts.
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential clang lld llvm flex bison m4 perl autoconf automake \
            libtool pkg-config xz-utils unzip zlib1g-dev libssl-dev uuid-dev \
            ca-certificates curl git python3 python3-venv
          clang --version | head -1
          test -f /usr/include/uuid/uuid.h || { echo "uuid-dev missing"; exit 1; }

      - name: Theos (cctools for the Mach-O link, and the iPhoneOS SDK)
        run: |
          set -euo pipefail
          export THEOS="$HOME/theos"
          git clone -q --recursive https://github.com/theos/theos.git "$THEOS"
          # The Linux iOS toolchain is published by L1ghtmann/llvm-project, which is what
          # theos' own bin/install-theos fetches (install-theos L461). There is no
          # theos/toolchain repository, so a URL under it is a 404.
          url=https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-x86_64.tar.xz
          echo "downloading $url"
          curl -sL --fail --retry 3 "$url" | tar -xJ -C "$THEOS/toolchain/"
          ls "$THEOS/toolchain"
          ls "$THEOS/toolchain/linux/iphone/bin" | head -20
          test -x "$THEOS/toolchain/linux/iphone/bin/ld" \
            || { echo "no cctools at \$THEOS/toolchain/linux/iphone/bin"; exit 1; }
          # The SDK the kernel is compiled against. `install-sdk 16.5` is not offered by theos
          # any more ("we do not currently provide 16.5.sdk"), but `latest` installs an
          # iPhoneOS16.5.sdk anyway -- which is what this kernel needs. Try the exact version,
          # fall back to latest, and judge only by whether the directory arrived.
          "$THEOS/bin/install-sdk" 16.5 || true
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" ]; then
            "$THEOS/bin/install-sdk" latest
          fi
          ls "$THEOS/sdks"
          test -d "$THEOS/sdks/iPhoneOS16.5.sdk/usr/include" \
            || { echo "no iPhoneOS16.5.sdk in \$THEOS/sdks"; ls -la "$THEOS/sdks"; exit 1; }
          du -sh "$THEOS/toolchain" "$THEOS/sdks"

      - name: Apply the work to Apple's XNU
        run: |
          set -e
          export THEOS="$HOME/theos"
          ./xnu/apply.sh
          du -sh xnu-src

      - name: Dependencies (mig, unifdef, tcsh, the SDK overlay, two libraries)
        run: |
          set -e
          export THEOS="$HOME/theos"
          ./xnu-deps/setup.sh
          du -sh xnu-deps

      - name: Build
        run: |
          set -e
          export THEOS="$HOME/theos"
          # `-k`: the build always ends in check_all_exports after the kernel is linked; the file's
          # existence and date are what count, not make's exit status (xnu/README.md).
          ./xnu-build.sh -j"$(nproc)" -k || true
          K=xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          ls -l "$K" || { echo "THE KERNEL WAS NOT BUILT"; exit 1; }
          file "$K" || true
          sha256sum "$K"
          echo "KERNEL=$K" >> "$GITHUB_ENV"

      - name: Upload the kernel
        uses: actions/upload-artifact@v4
        with:
          name: mach.development.bcm2837
          path: xnu-src/xnu-8796.121.2/BUILD/obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837
          if-no-files-found: error
          retention-days: 14

      - name: Upload the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xnu-deps/*.log
            xnu-src/xnu-8796.121.2/BUILD/obj/*/*.log
          if-no-files-found: ignore
          retention-days: 7

  # Pack what the two build jobs produced into the one file a phone can be flashed with.
  # This is the step that turns "it compiles" into "there is something to try", so it runs
  # only when both halves are real. mkpayload.py wraps the loader plus the kernel into the
  # XNUP container the loader looks for, and mkxnuimg.py puts that container into an Android
  # boot image.
  image:
    name: pack boot.img
    needs: [kernel, loader]
    # The UEFI firmware volume is board-specific and built by the uefi workflow, which is
    # a separate dispatch because its tree is ~5 GB. It is passed in rather than switched
    # on, because a repository_dispatch/workflow_run dependency would couple the two.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the kernel and the loader
        uses: actions/download-artifact@v4
        with:
          path: in

      - name: Fetch the polaris UEFI firmware, if the uefi workflow has produced one
        continue-on-error: true
        uses: actions/download-artifact@v4
        with:
          name: polaris-SILICIUM_UEFI.fd
          path: in

      # mkxnuimg.py assembles BootShim, whose Makefile runs `llvm-objcopy -O binary`.
      # The image job has no build dependencies of its own, so without this the pack
      # step died with "make: llvm-objcopy: No such file or directory ... Error 127" --
      # the same failure the uefi workflow already had to fix.
      - name: Assemble the boot shim's toolchain
        run: |
          set -e
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends llvm make clang
          # Ubuntu ships a versioned binary (llvm-objcopy-18); the Makefile calls it
          # unversioned.
          for v in $(ls /usr/bin/llvm-objcopy-* 2>/dev/null | sed 's/.*-//'); do
            sudo ln -sf "/usr/bin/llvm-objcopy-$v" /usr/bin/llvm-objcopy
            break
          done
          command -v llvm-objcopy
          llvm-objcopy --version | head -1
          command -v clang
          command -v make

      - name: Pack
        run: |
          set -e
          ls -l in/mach.development.bcm2837/mach.development.bcm2837 in/loader.efi/loader.efi
          mkdir -p out/polaris

          # The device profile is the single source of these values. They must be EXPORTED:
          # mkxnuimg.py reads them through os.environ and, when they are unset, silently
          # falls back to its redwood defaults (TARGET=redwood, FD_BASE=0x9FD00000,
          # FD_SIZE=0x200000, PAYLOAD_BASE=0xF0000000) and to the poco-x5-pro prebuilt
          # firmware. Its guard only fires when TARGET is explicitly something other than
          # redwood, so a missing export produces a plausible-looking image built for the
          # wrong phone. That happened once; this is the fix.
          set -a
          . ./devices/polaris/device.conf
          set +a
          echo "TARGET=$UEFI_TARGET FD_BASE=$FD_BASE FD_SIZE=$FD_SIZE PAYLOAD_BASE=$PAYLOAD_BASE"
          echo "BOOTARGS=$BOOTARGS"
          test -n "$UEFI_TARGET" || { echo 'UEFI_TARGET not set by device.conf'; exit 1; }
          test -n "$FD_BASE" || { echo 'FD_BASE not set by device.conf'; exit 1; }

          # The UEFI firmware must be polaris'. If one was downloaded from the uefi
          # workflow it is at in/SILICIUM_UEFI.fd; otherwise UEFI_FD must name a real file.
          # Either way there is no fallback to another phone's prebuilt: mkxnuimg.py would
          # happily use the poco-x5-pro one when UEFI_FD is unset, and that produced an
          # image for the wrong SoC once.
          # download-artifact@v4 without a run-id only sees THIS run's artifacts, and the
          # firmware is built by the separate "polaris UEFI" workflow, so in practice the
          # download above finds nothing. The committed copy under devices/polaris/prebuilt
          # is what actually supplies it -- the same arrangement poco-x5-pro uses, and the
          # reason that board's images can be rebuilt without its UEFI tree.
          if [ -f in/SILICIUM_UEFI.fd ]; then
            export UEFI_FD="$PWD/in/SILICIUM_UEFI.fd"
            echo "UEFI_FD from the uefi workflow: $UEFI_FD"
          elif [ -f devices/polaris/prebuilt/SILICIUM_UEFI.fd ]; then
            export UEFI_FD="$PWD/devices/polaris/prebuilt/SILICIUM_UEFI.fd"
            echo "UEFI_FD from devices/polaris/prebuilt: $UEFI_FD"
          fi
          test -n "$UEFI_FD" -a -f "$UEFI_FD" || {
            echo 'No polaris UEFI firmware available.'
            echo 'Run the "polaris UEFI" workflow, or set UEFI_FD to a built'
            echo 'SILICIUM_UEFI.fd. Refusing to fall back to the redwood prebuilt.'
            exit 1
          }
          FD_ACTUAL=$(stat -c %s "$UEFI_FD")
          echo "UEFI FD: $UEFI_FD ($FD_ACTUAL bytes, device.conf FD_SIZE=$((FD_SIZE)))"
          test "$FD_ACTUAL" = "$((FD_SIZE))" || {
            echo 'FD size disagrees with FD_SIZE in devices/polaris/device.conf.'
            echo 'mkxnuimg.py asserts these are equal; fix whichever is wrong.'
            exit 1
          }
          # Prove it is polaris firmware and not another board's, before it goes in the
          # image. The FD is an FFS volume, so the strings of its driver names are in it.
          if strings -a "$UEFI_FD" | grep -qiE 'yupik|redwood|sm7325'; then
            echo 'the FD mentions a redwood-class SoC: wrong firmware for polaris'
            exit 1
          fi
          echo 'UEFI FD is not redwood firmware'

          # The container: the loader is what the payload carries as "loader.efi", and the
          # kernel as "kernel". The cmdline is the board's, with the platform named
          # explicitly -- the loader's own auto-detection cannot tell polaris from raphael,
          # so it must be told (see the platform= handling in xnuloader/loader.c).
          python3 xnuloader/mkpayload.py \
            -o out/polaris/usb-payload.bin \
            --usb \
            --cmdline "platform=polaris $BOOTARGS" \
            loader.efi=in/loader.efi/loader.efi \
            kernel=in/mach.development.bcm2837/mach.development.bcm2837

          # The device tree. device.conf names out/polaris/polaris.dtb, and nothing in this
          # repository produces it, so prefer the one the uefi workflow built against and
          # shipped beside the firmware. Without this fallback mkxnuimg.py would reach into
          # Mu-Silicium/Resources/DTBs and use whatever it found there, which is the kind of
          # silent substitution that produced a redwood image once already.
          if [ -f in/polaris.dtb ]; then
            export DTB="$PWD/in/polaris.dtb"
            echo "DTB from the uefi workflow: $DTB"
          elif [ -f devices/polaris/prebuilt/polaris.dtb ]; then
            export DTB="$PWD/devices/polaris/prebuilt/polaris.dtb"
            echo "DTB from devices/polaris/prebuilt: $DTB"
          fi
          test -f "$DTB" || { echo "DTB=$DTB does not exist"; exit 1; }
          echo "DTB: $DTB ($(stat -c %s "$DTB") bytes)"
          head -c 4 "$DTB" | od -An -tx1 | grep -q 'd0 0d fe ed' \
            || { echo "the DTB does not start with d00dfeed"; exit 1; }
          if strings -a "$DTB" | grep -qiE 'yupik|sm7325'; then
            echo "the DTB describes a redwood-class SoC, not polaris"
            exit 1
          fi
          python3 mkxnuimg.py -p out/polaris/usb-payload.bin -o out/polaris/boot.img
          ls -l out/polaris/
          sha256sum out/polaris/*

      - name: Check the image is what it claims to be
        run: |
          set -e
          python3 - <<'PY'
          import struct, zlib
          p = "out/polaris/boot.img"
          d = open(p, "rb").read()
          # Android boot image v0: "ANDROID!" magic, page size at byte 36 (little endian)
          assert d[:8] == b"ANDROID!", "no ANDROID! magic: %r" % d[:8]
          page = struct.unpack_from("<I", d, 36)[0]
          kernel_size = struct.unpack_from("<I", d, 8)[0]
          ramdisk_size = struct.unpack_from("<I", d, 16)[0]
          print("ANDROID! page_size=%d kernel=%d ramdisk=%d total=%d"
                % (page, kernel_size, ramdisk_size, len(d)))
          assert page in (2048, 4096, 8192, 16384), "implausible page size %d" % page
          assert kernel_size > 0, "empty kernel"
          assert len(d) >= page + kernel_size, "image truncated"
          # The kernel field is gzip(BootShim + UEFI FD + XNUP container) + DTB (mkxnuimg.py),
          # so the container is inside the compressed stream and not searchable in the raw
          # image. The device tree is appended uncompressed after the gzip member, so
          # decompress only the member: gzip.decompress() would reject the trailing DTB,
          # while decompressobj stops at the member's end and keeps the tail.
          body = d[page:page + kernel_size]
          assert body[:2] == b"\x1f\x8b", "kernel field is not gzip: %r" % body[:2]
          dec = zlib.decompressobj(zlib.MAX_WBITS | 16)
          blob = dec.decompress(body) + dec.flush()
          tail = dec.unused_data
          print("decompressed kernel field: %d -> %d bytes, %d bytes of DTB after the member"
                % (len(body), len(blob), len(tail)))
          if len(tail) >= 4:
              print("appended device tree magic: %r" % tail[:4])
              assert tail[:4] == b"\xd0\x0d\xfe\xed", "appended data is not an FDT"
          assert b"XNUP" in blob, "no XNUP container after decompression"
          i = blob.index(b"XNUP")
          csize = struct.unpack_from("<I", blob, i + 4)[0]
          print("XNUP at 0x%x, container size 0x%x (%d)" % (i, csize, csize))
          assert csize > 0 and i + csize <= len(blob), "container size does not fit"
          for name in (b"loader.efi", b"kernel", b"cmdline"):
              assert name in blob[i:i + csize], "payload has no %r entry" % name
          print("payload entries: loader.efi kernel cmdline -- all present")
          assert b"platform=polaris" in blob[i:i + csize], "cmdline does not name the platform"
          # The DTB follows the gzip member inside the kernel field; report whether the
          # bootloader will find one, without insisting on it (a shim-only image has none).
          rest = body[len(body) - (len(body) - len(gzip.compress(b""))) :] if False else None
          # The board must be polaris, not a leftover prebuilt for another phone. The
          # appended device tree is the cheapest proof: it names its own SoC.
          assert len(tail) > 8, "no device tree appended"
          assert b"polaris" in tail.lower() or b"Polaris" in tail, \
              "the appended DTB does not mention polaris -- wrong board firmware"
          for bad in (b"Yupik", b"yupik", b"redwood", b"SM7325"):
              assert bad not in tail, "the DTB is %r: this is redwood firmware" % bad
          print("appended DTB names polaris and is not redwood")
          print("OK")
          PY

      - name: Upload boot.img
        uses: actions/upload-artifact@v4
        with:
          name: polaris-boot.img
          path: out/polaris/boot.img
          if-no-files-found: error
          retention-days: 14

