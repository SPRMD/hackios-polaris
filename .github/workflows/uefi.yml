name: polaris UEFI

# Build Mu-Silicium for the Xiaomi Mi MIX 2S (polaris). This is the firmware volume the phone
# runs before XNU, and the boot-image job needs it: without a board-correct FD there is nothing
# to put in the FD region, and it must not fall back to another phone's prebuilt.
#
# It is built here rather than on the developer's machine because the tree is ~5 GB and the
# EDK2 build wants a Linux toolchain.
on:
  workflow_dispatch:
  push:
    branches: [main, raphael-bringup, polaris-uefi]
    paths:
      - '.github/workflows/uefi.yml'
      - 'devices/polaris/uefi/**'

env:
  MU_REPO: https://github.com/Project-Silicium/Mu-Silicium.git

jobs:
  uefi:
    name: build polaris SILICIUM_UEFI.fd
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Disk space
        run: |
          df -h / || true
          # The Mu tree plus submodules is several GB and the root volume is small.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / || true

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential uuid-dev iasl nasm python3 python3-venv python3-pip \
            git ca-certificates curl xz-utils
          python3 --version

      - name: Clone Mu-Silicium and its Binaries submodule
        run: |
          set -e
          # Not /mnt: it exists on this image but is not writable by the runner user, which
          # costs a whole run to discover. RUNNER_TEMP is on the large volume and is ours.
          cd "$RUNNER_TEMP"
          BASE="$(cat "$GITHUB_WORKSPACE/devices/polaris/uefi/BASE")"
          echo "BASE=$BASE"
          git init -q Mu-Silicium
          cd Mu-Silicium
          git remote add origin "$MU_REPO"
          git fetch -q --depth 1 origin "$BASE"
          git checkout -q FETCH_HEAD
          git submodule update -q --init --recursive --depth 1
          echo "--- checked out ---"
          git log --oneline -1
          test -d Binaries/polaris || { echo "no Binaries/polaris in the submodule"; exit 1; }
          ls Binaries/polaris
          du -sh . Binaries

      - name: Put the polaris port into the tree
        run: |
          set -e
          # This is the step that makes the firmware correct. Upstream ships a polarisPkg and
          # it builds as it stands, so a plain 'build_uefi.py -d polaris' yields a volume that
          # looks right and is not: without MemoryMapLib's "XNU Payload" reservation the
          # loader's copy into PAYLOAD_BASE lands outside every region the memory map
          # describes. raphael's map has that entry; upstream's polarisPkg does not.
          #
          # mu-silicium.patch adds the BootShim copy loop and the XnuLoader handoff in
          # BootManager/Sec; files/ replaces the platform package (drops the ACPI set,
          # switches the display driver).
          MU="$RUNNER_TEMP/Mu-Silicium"
          cd "$MU"
          git apply --whitespace=nowarn "$GITHUB_WORKSPACE/devices/polaris/uefi/mu-silicium.patch"
          cp -r "$GITHUB_WORKSPACE/devices/polaris/uefi/files/." "$MU/"
          # Prove the reservation is in the tree rather than trusting the copy.
          grep -n 'XNU Payload' \
            "$MU/Platforms/Xiaomi/polarisPkg/Library/MemoryMapLib/MemoryMapLib.c"
          grep -n 'PAYLOAD_BASE' \
            "$MU/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/XnuLoader.c" | head -3

      - name: Build polaris
        run: |
          set -e
          cd "$RUNNER_TEMP/Mu-Silicium"
          export PATH="$PWD:$PATH"
          python3 -m pip install --quiet --break-system-packages -r pip-requirements.txt || \
            python3 -m pip install --quiet -r pip-requirements.txt
          python3 build_uefi.py -d polaris 2>&1 | tail -100
          echo "--- firmware volumes produced ---"
          find . -name '*.fd' -not -path './Binaries/*' | head -20

      - name: Collect the firmware
        run: |
          set -e
          cd "$RUNNER_TEMP/Mu-Silicium"
          FD=$(find . -name 'SILICIUM_UEFI.fd' -not -path './Binaries/*' | head -1)
          test -n "$FD" || { echo "build produced no SILICIUM_UEFI.fd"; exit 1; }
          echo "FD=$FD"
          ls -l "$FD"
          sha256sum "$FD"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$FD" "$GITHUB_WORKSPACE/out/SILICIUM_UEFI.fd"

          SIZE=$(stat -c %s "$GITHUB_WORKSPACE/out/SILICIUM_UEFI.fd")
          echo "SIZE=$SIZE (0x$(printf %x $SIZE))"
          . "$GITHUB_WORKSPACE/devices/polaris/device.conf"
          echo "device.conf FD_SIZE=$((FD_SIZE)) (0x$(printf %x "$((FD_SIZE))"))"
          # The same assertion mkxnuimg.py makes, moved earlier so the failure names the
          # mismatch instead of an image that does not build.
          if [ "$SIZE" != "$((FD_SIZE))" ]; then
            echo "FAIL: the built FD is $SIZE bytes but device.conf FD_SIZE is $((FD_SIZE))."
            echo "One of the two is wrong. The FD region in uefiplat.cfg from this phone's"
            echo "xbl.img is the authority: it says 0x220000 at 0x9FC00000."
            exit 1
          fi
          if strings -a "$GITHUB_WORKSPACE/out/SILICIUM_UEFI.fd" | grep -qiE 'yupik|redwood|sm7325'; then
            echo "FAIL: the FD mentions a redwood-class SoC; that is not polaris firmware."
            exit 1
          fi
          echo "FD size matches device.conf and it is polaris firmware"

      - name: Upload the firmware
        uses: actions/upload-artifact@v4
        with:
          name: polaris-SILICIUM_UEFI.fd
          path: out/SILICIUM_UEFI.fd
          if-no-files-found: error
          retention-days: 14