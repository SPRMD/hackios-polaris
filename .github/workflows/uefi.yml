name: polaris UEFI

# Build Mu-Silicium for the Xiaomi Mi MIX 2S (polaris). This is the firmware volume the phone
# runs before XNU, and the boot-image job needs it: without a board-correct FD there is nothing
# to put in the FD region, and it must not fall back to another phone's prebuilt.
#
# It is built here rather than on the developer's machine because the tree is ~5 GB and the
# EDK2 build wants a Linux toolchain.
on:
  # Dispatch only. This build takes up to four hours and pulls a several-GB tree, so it is run
  # when a firmware volume is actually wanted rather than on every edit under
  # devices/polaris/uefi. The cheap gate for those edits is the polaris-uefi workflow, which
  # checks the port against itself and proves the patch applies in about five minutes.
  workflow_dispatch:

env:
  MU_REPO: https://github.com/Project-Silicium/Mu-Silicium.git

jobs:
  uefi:
    name: build polaris SILICIUM_UEFI.fd
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Disk space
        run: |
          df -h / || true
          # The Mu tree plus submodules is several GB and the root volume is small.
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost || true
          df -h / || true

      - name: Dependencies
        run: |
          sudo apt-get update -qq
          # llvm is required, not optional: Mu-Silicium's BootShim Makefile runs
          # `llvm-objcopy -O binary`, and without it the build dies with
          # "make: llvm-objcopy: No such file or directory ... Error 127".
          #
          # mono is required by stuart's own package resolution: on a non-Windows host it
          # runs NuGet through mono, and without it the build fails at
          # "[SDE] Failed to fetch NugetDependency: mu_nasm@20016.1.1: Mono is required"
          # before compiling a single file. ca-certificates-mono is named in that message and
          # is needed for mono's TLS to work.
          sudo apt-get install -y -qq --no-install-recommends \
            build-essential uuid-dev iasl nasm python3 python3-venv python3-pip \
            git ca-certificates curl xz-utils llvm mono-devel ca-certificates-mono
          python3 --version
          # The unversioned name is what the Makefile calls; some images only ship the
          # versioned one, so make the link if it is missing.
          if ! command -v llvm-objcopy >/dev/null 2>&1; then
            found=$(ls /usr/lib/llvm-*/bin/llvm-objcopy 2>/dev/null | head -1)
            test -n "$found" || { echo "no llvm-objcopy anywhere"; exit 1; }
            echo "linking $found -> /usr/local/bin/llvm-objcopy"
            sudo ln -sf "$found" /usr/local/bin/llvm-objcopy
          fi
          llvm-objcopy --version
          clang --version | head -1 || true
          # Confirm everything the build shells out to resolves before spending 20 minutes.
          for t in clang llvm-objcopy make nasm iasl mono; do
            command -v $t || { echo "missing tool: $t"; exit 1; }
          done

      - name: Clone Mu-Silicium and its submodules
        run: |
          set -e
          # Not /mnt: it exists on this image but is not writable by the runner user, which
          # costs a whole run to discover. RUNNER_TEMP is on the large volume and is ours.
          #
          # The submodules are needed -- the DSC pulls MdeModulePkg/ArmPkg/EmbeddedPkg out of
          # Common/Mu and Mu_Basecore -- and they are big: mu_basecore 330 MB, Device-Binaries
          # 131 MB, mu_plus 18 MB, Silicium-ACPI 5 MB. So they are shallow and fetched in
          # parallel; serial --depth 1 was still running after seven minutes.
          #
          # build_uefi.py's own `git submodule update` only runs with -u, which is not passed,
          # so this is the only place submodules are populated.
          cd "$RUNNER_TEMP"
          BASE="$(cat "$GITHUB_WORKSPACE/devices/polaris/uefi/BASE")"
          echo "BASE=$BASE"
          git init -q Mu-Silicium
          cd Mu-Silicium
          git remote add origin "$MU_REPO"
          git fetch -q --depth 1 origin "$BASE"
          git checkout -q FETCH_HEAD
          git log --oneline -1

          echo "--- submodules, shallow and parallel ---"
          date +%T
          git submodule update --init --depth 1 --jobs 4 --recommend-shallow
          date +%T
          test -d Binaries/polaris || { echo "no Binaries/polaris after the submodule update"; exit 1; }
          echo "polaris drivers: $(find Binaries/polaris -name '*.inf' | wc -l) .inf files"
          # The EDK2 packages the DSC includes. If one is missing the build fails deep inside
          # stuart with a confusing message, so say it here instead.
          for d in Common/Mu Mu_Basecore Common/Mu_OEM_Sample; do
            test -d "$d" || { echo "missing submodule: $d"; exit 1; }
            echo "present: $d"
          done
          du -sh . Binaries

      - name: Put the polaris port into the tree
        run: |
          set -e
          # This is the step that makes the firmware correct. Upstream ships a polarisPkg and
          # it builds as it stands, so a plain 'build_uefi.py -d polaris' yields a volume that
          # looks right and is not: without MemoryMapLib's "XNU Payload" reservation the
          # loader's copy into PAYLOAD_BASE lands outside every region the memory map
          # describes. raphael's map has that entry; upstream's polarisPkg does not.
          #
          # mu-silicium.patch adds the BootShim copy loop and the XnuLoader handoff in
          # BootManager/Sec; files/ replaces the platform package (drops the ACPI set,
          # switches the display driver).
          MU="$RUNNER_TEMP/Mu-Silicium"
          cd "$MU"
          # --ignore-whitespace is required, not cosmetic. Mu-Silicium stores BootManager.c,
          # BootManagerLib.inf and Sec.c with CRLF (it is a Windows-developed EDK2 project),
          # while this patch's context lines are LF, so plain `git apply` fails with "patch does
          # not apply" on exactly those three files and applies BootShim.S, whose file happens
          # to be LF. Measured, not guessed: reproduced on an LF checkout at BASE, where
          # --ignore-whitespace turns the same failure into a clean apply. Not a line-ending
          # problem in this repository -- the patch is LF as stored.
          git apply --whitespace=nowarn --ignore-whitespace \
            "$GITHUB_WORKSPACE/devices/polaris/uefi/mu-silicium.patch"
          cp -r "$GITHUB_WORKSPACE/devices/polaris/uefi/files/." "$MU/"
          # Prove the reservation is in the tree rather than trusting the copy.
          grep -n 'XNU Payload' \
            "$MU/Platforms/Xiaomi/polarisPkg/Library/MemoryMapLib/MemoryMapLib.c"
          grep -n 'PAYLOAD_BASE' \
            "$MU/Silicon/Silicium/SiliciumPkg/Library/BootManagerLib/XnuLoader.c" | head -3

      - name: Build polaris
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/Mu-Silicium"
          export PATH="$PWD:$PATH"
          python3 -m pip install --quiet --break-system-packages -r pip-requirements.txt || \
            python3 -m pip install --quiet -r pip-requirements.txt
          # No pipe to tail: `build_uefi.py | tail` reports tail's exit status, so a build that
          # died still showed a green step. That happened -- the run reported "Build polaris
          # success" while the log said "make: llvm-objcopy: No such file or directory ...
          # Error 127" and no volume was produced. The output goes to a file and is echoed
          # afterwards, so the exit status that decides the step is the build's own.
          set +e
          python3 build_uefi.py -d polaris > "$RUNNER_TEMP/build.log" 2>&1
          rc=$?
          set -e
          echo "build_uefi.py exit code: $rc"
          tail -120 "$RUNNER_TEMP/build.log"
          if [ "$rc" -ne 0 ]; then
            echo "::error::build_uefi.py failed with exit code $rc"
            exit "$rc"
          fi
          echo "--- firmware volumes produced ---"
          find . -name '*.fd' -not -path './Binaries/*' | tee "$RUNNER_TEMP/fd-list.txt"
          # An exit code of 0 with no volume is still a failure, and a quiet one otherwise.
          test -s "$RUNNER_TEMP/fd-list.txt" || {
            echo "::error::build_uefi.py succeeded but produced no .fd at all"; exit 1; }

      - name: Collect the firmware
        run: |
          set -e
          cd "$RUNNER_TEMP/Mu-Silicium"
          FD=$(find . -name 'SILICIUM_UEFI.fd' -not -path './Binaries/*' | head -1)
          test -n "$FD" || { echo "build produced no SILICIUM_UEFI.fd"; exit 1; }
          echo "FD=$FD"
          ls -l "$FD"
          sha256sum "$FD"
          mkdir -p "$GITHUB_WORKSPACE/out"
          cp "$FD" "$GITHUB_WORKSPACE/out/SILICIUM_UEFI.fd"

          SIZE=$(stat -c %s "$GITHUB_WORKSPACE/out/SILICIUM_UEFI.fd")
          echo "SIZE=$SIZE (0x$(printf %x $SIZE))"
          . "$GITHUB_WORKSPACE/devices/polaris/device.conf"
          echo "device.conf FD_SIZE=$((FD_SIZE)) (0x$(printf %x "$((FD_SIZE))"))"
          # The same assertion mkxnuimg.py makes, moved earlier so the failure names the
          # mismatch instead of an image that does not build.
          if [ "$SIZE" != "$((FD_SIZE))" ]; then
            echo "FAIL: the built FD is $SIZE bytes but device.conf FD_SIZE is $((FD_SIZE))."
            echo "One of the two is wrong. The FD region in uefiplat.cfg from this phone's"
            echo "xbl.img is the authority: it says 0x220000 at 0x9FC00000."
            exit 1
          fi
          if strings -a "$GITHUB_WORKSPACE/out/SILICIUM_UEFI.fd" | grep -qiE 'yupik|redwood|sm7325'; then
            echo "FAIL: the FD mentions a redwood-class SoC; that is not polaris firmware."
            exit 1
          fi
          echo "FD size matches device.conf and it is polaris firmware"

          # The device tree the image will be packed with. Take Mu-Silicium's polaris.dtb as
          # delivered and confirm it describes this SoC, so the image job gets a DTB that is
          # named and checked rather than one that mkxnuimg.py happens to find.
          DTB="$RUNNER_TEMP/Mu-Silicium/Resources/DTBs/polaris.dtb"
          test -f "$DTB" || { echo "::error::no Resources/DTBs/polaris.dtb in Mu-Silicium"; exit 1; }
          cp "$DTB" "$GITHUB_WORKSPACE/out/polaris.dtb"
          ls -l "$GITHUB_WORKSPACE/out/polaris.dtb"
          printf 'DTB magic: '; head -c 4 "$GITHUB_WORKSPACE/out/polaris.dtb" | od -An -tx1
          # A DTB starts d00dfeed. Anything else is not a device tree and must not be appended.
          head -c 4 "$GITHUB_WORKSPACE/out/polaris.dtb" | od -An -tx1 | grep -q 'd0 0d fe ed' \
            || { echo "::error::the polaris DTB does not start with d00dfeed"; exit 1; }
          if strings -a "$GITHUB_WORKSPACE/out/polaris.dtb" | grep -qiE 'yupik|sm7325'; then
            echo "::error::the DTB describes a redwood-class SoC, not polaris"; exit 1
          fi
          strings -a "$GITHUB_WORKSPACE/out/polaris.dtb" | grep -i 'polaris' | head -3 \
            || { echo "::error::the DTB never names polaris"; exit 1; }
          echo "polaris DTB is a device tree and names polaris"

      - name: Upload the firmware
        uses: actions/upload-artifact@v4
        with:
          name: polaris-SILICIUM_UEFI.fd
          # The device tree travels with the firmware. The image job needs one at $DTB, nothing
          # in this repository produces it, and mkxnuimg.py silently falls back to
          # Mu-Silicium/Resources/DTBs/<target>.dtb -- which for polaris exists upstream
          # (492460 bytes) but is a community snapshot, not this phone's own. Shipping it as an
          # artifact makes the difference between "the DTB that was built against" and "whatever
          # happened to be in the tree" visible, and lets the image job name it explicitly.
          # It is still not the authority: the phone's own DTB is appended by the bootloader and
          # is what the hardware actually uses; this one only has to describe the board well
          # enough for XNU's platform detection.
          path: |
            out/SILICIUM_UEFI.fd
            out/polaris.dtb
          if-no-files-found: error
          retention-days: 14